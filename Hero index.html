<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 400px;
      padding: 20px;
    }
    .chat-box {
      height: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
    }
    .chat-message {
      margin-bottom: 10px;
    }
    .chat-message.user {
      text-align: right;
      color: #007bff;
    }
    .chat-message.ai {
      text-align: left;
      color: #333;
    }
    input[type="text"] {
      width: calc(100% - 80px);
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 70px;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <div class="chat-message ai">Hello! I am your AI assistant. How can I help you today?</div>
    </div>
    <div>
      <input type="text" id="user-input" placeholder="Type your message here..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const userInput = document.getElementById('user-input').value;
      if (!userInput) return;

      // Display user's message
      const chatBox = document.getElementById('chat-box');
      const userMessage = document.createElement('div');
      userMessage.className = 'chat-message user';
      userMessage.textContent = userInput;
      chatBox.appendChild(userMessage);

      // Clear input
      document.getElementById('user-input').value = '';

      // Send user input to OpenAI API
      try {
        const response = await fetch('https://api.openai.com/v1/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer YOUR_API_KEY_HERE', // Replace with your OpenAI API key
          },
          body: JSON.stringify({
            model: 'text-davinci-003', // Use 'gpt-4' if you have access
            prompt: userInput,
            max_tokens: 150,
            temperature: 0.7,
          }),
        });

        const data = await response.json();
        const aiResponse = data.choices[0].text.trim();

        // Display AI's response
        const aiMessage = document.createElement('div');
        aiMessage.className = 'chat-message ai';
        aiMessage.textContent = aiResponse;
        chatBox.appendChild(aiMessage);

        // Scroll to the bottom of the chat box
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        console.error('Error:', error);
        const errorMessage = document.createElement('div');
        errorMessage.className = 'chat-message ai';
        errorMessage.textContent = 'Sorry, something went wrong. Please try again.';
        chatBox.appendChild(errorMessage);
      }
    }
  </script>
</body>
</html>
